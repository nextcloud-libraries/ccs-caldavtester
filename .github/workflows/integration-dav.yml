# Adapted from nextcloud/server .github/workflows/integration-dav.yml:
# runs this CalDAVTester checkout against a Nextcloud server.
name: DAV integration tests
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      server-ref:
        description: 'nextcloud/server branch, tag or SHA to test against'
        required: false
        default: 'master'

permissions:
  contents: read

concurrency:
  group: integration-caldav-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  integration-caldav:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.5']
        endpoint: ['old', 'new']
        service: ['CalDAV', 'CardDAV']

    name: ${{ matrix.service }} (${{ matrix.endpoint }} endpoint) php${{ matrix.php-versions }}

    steps:
      - name: Checkout CalDAVTester
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: CalDAVTester

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: nextcloud/server
          ref: ${{ github.event.inputs.server-ref || 'master' }}
          submodules: true
          path: server

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, redis, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Set up CalDAVTester
        working-directory: CalDAVTester
        run: |
          python -m pip install -r requirements.txt

      - name: Set up Nextcloud
        working-directory: server
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --database-host=127.0.0.1 --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          # disable the trashbin, so recurrent deletion of the same object works
          ./occ config:app:set dav calendarRetentionObligation --value=0
          # Prepare users
          OC_PASS=user01 ./occ user:add --password-from-env user01
          OC_PASS=user02 ./occ user:add --password-from-env user02
          # Prepare calendars
          ./occ dav:create-calendar user01 calendar
          ./occ dav:create-calendar user01 shared
          ./occ dav:create-calendar user02 calendar
          # Prepare address books
          ./occ dav:create-addressbook user01 addressbook
          ./occ dav:create-addressbook user02 addressbook

      - name: Run Nextcloud
        working-directory: server
        run: |
          php -S localhost:8888 &

      - name: Run CalDAVTester
        run: |
          cp "server/apps/dav/tests/testsuits/caldavtest/serverinfo-${{ matrix.endpoint }}${{ matrix.endpoint == 'old' && (matrix.service == 'CardDAV' && '-carddav' || '-caldav') || '' }}-endpoint.xml" "server/apps/dav/tests/testsuits/caldavtest/serverinfo.xml"
          pushd CalDAVTester
          python testcaldav.py --print-details-onfail --basedir "../server/apps/dav/tests/testsuits/caldavtest" -o cdt.txt \
            "${{ matrix.service }}/current-user-principal.xml" \
            "${{ matrix.service }}/sync-report.xml" \
            ${{ matrix.endpoint == 'new' && format('{0}/sharing-{1}.xml', matrix.service, matrix.service == 'CalDAV' && 'calendars' || 'addressbooks') || ';' }}
          popd

      - name: Upload CalDAVTester log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdt-${{ matrix.service }}-${{ matrix.endpoint }}-php${{ matrix.php-versions }}
          path: CalDAVTester/cdt.txt
          if-no-files-found: ignore

      - name: Print Nextcloud logs
        if: always()
        run: |
          cat server/data/nextcloud.log
